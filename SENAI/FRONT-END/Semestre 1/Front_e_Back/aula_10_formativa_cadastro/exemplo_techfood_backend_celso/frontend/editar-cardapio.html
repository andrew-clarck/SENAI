<!doctype html>

<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="src/styles/global.css" />
    <link rel="stylesheet" href="src/styles/editar-cardapio.css" />

    <title>Editar Cardápio</title>
  </head>

  <body>
    <header id="topo-loja">
      <h1 id="titulo-site">TechFood - Sabor & Saber</h1>
      <p id="boas-vindas">Carregando...</p>

      <input type="checkbox" id="bt_menu" />
      <label for="bt_menu" id="label-menu">&#9776;</label>

      <nav id="menu">
        <ul>
          <li><a href="index.html">Cardápio</a></li>
          <li><a href="pedidos.html">Meus Pedidos</a></li>
          <li><a href="cadastro.html">Cadastrar Prato</a></li>
          <li>
            <a href="editar-cardapio.html" class="ativo">Editar Cardápio</a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="secao-edicao">
        <h2 class="titulo-secao">Editar Cardápio</h2>

        <div id="lista-produtos"></div>
      </section>

      <section id="secao-formulario">
        <div id="modal-edicao" class="modal">
          <div class="modal-content">
            <span class="fechar-modal">&times;</span>

            <h2>Editar Produto</h2>

            <form id="form-edicao">
              <input type="hidden" id="produto-id" />

              <label for="nome">Nome do Prato:</label>
              <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite o nome do prato"
                required
              />

              <label for="descricao">Descrição:</label>
              <textarea
                id="descricao"
                name="descricao"
                placeholder="Descreva o prato"
                required
              ></textarea>

              <label for="preco">Preço:</label>
              <input
                type="text"
                id="preco"
                name="preco"
                placeholder="0,00"
                inputmode="decimal"
                required
              />

              <label for="categoria">Categoria:</label>
              <select id="categoria" name="categoria" required>
                <option value="">Selecione uma categoria</option>
                <option value="entrada">Entrada</option>
                <option value="prato_principal">Prato Principal</option>
                <option value="sobremesa">Sobremesa</option>
                <option value="bebida">Bebida</option>
              </select>

              <label for="disponivel">Disponível:</label>
              <input type="checkbox" id="disponivel" name="disponivel" />

              <label for="imagem">Imagem do Prato:</label>

              <div class="preview-container">
                <img id="preview-imagem" src="" alt="Pré-visualização" />
              </div>

              <label for="imagem" class="btn-upload"> Alterar imagem </label>

              <input type="file" id="imagem" name="imagem" accept="image/*" />

              <span id="nome-arquivo"> Nenhuma imagem selecionada </span>

              <button type="submit">Salvar Alterações</button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer id="rodape">
      <div class="info-footer">
        <p><strong>TechFood 2026</strong></p>
        <p>Escola SENAI Ítalo Bologna - Itu/SP</p>
      </div>
      <p id="data-hora-footer"></p>
    </footer>

    <!-- TOAST -->

    <div id="toast"></div>

    <!-- MODAL CONFIRMAÇÃO -->

    <div id="modal-confirmacao" class="modal">
      <div class="modal-confirmacao-content">
        <h3>Excluir Produto</h3>

        <p>Tem certeza que deseja excluir este produto?</p>

        <div class="confirmacao-botoes">
          <button type="button" id="cancelar-exclusao">Cancelar</button>

          <button type="button" id="confirmar-exclusao">Excluir</button>
        </div>
      </div>
    </div>

    <script src="src/scripts/global.js"></script>

    <script src="src/scripts/api.js"></script>

    <script src="src/scripts/editar-cardapio.js"></script>
  </body>
</html>
