<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cardápio</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"

    <header class="bg-danger text-white text-center">
      <h1>Cardápio Brasileiro</h1>
    </header>
    <main class="container">
      <div class="row g-3">
        <article
          class="col-12 col-md-6 col-lg-4 bg-white p-4 rounded-3 shadow-sm"
        >
          <h2>Feijoada</h2>
          <p>Prato bão</p>
        </article>
        <article
          class="col-12 col-md-6 col-lg-4 bg-white p-4 rounded-3 shadow-sm"
        >
          <h2>Coxinha</h2>
          <p>Tem em toda esquina</p>
        </article>
        <article
          class="col-12 col-md-6 col-lg-4 bg-white p-4 rounded-3 shadow-sm"
        >
          <h2>Brigadeiro</h2>
          <p>Top 5 doces</p>
        </article>
      </div>
    </main>

</html>
