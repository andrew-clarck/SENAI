<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cardápio</title>
    <link rel="stylesheet" href="output.css" />
  </head>
  <body>
    <header
      class="bg-red-600 text-white text-center px-4 py-2 font-bold text-2xl"
    >
      <h1>Cardápio Brasileiro</h1>
    </header>
    <main class="container">
      <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <article class="bg-white p-4 rounded-lg shadow-sm">
          <h2 class="text-xl font-semibold">Feijoada</h2>
          <p>Prato bão</p>
        </article>
        <article class="bg-white p-4 rounded-lg shadow-sm">
          <h2 class="text-xl font-semibold">Coxinha</h2>
          <p>Tem em toda esquina</p>
        </article>
        <article class="bg-white p-4 rounded-lg shadow-sm">
          <h2 class="text-xl font-semibold">Brigadeiro</h2>
          <p>Top 5 doces</p>
        </article>
      </section>
    </main>
  </body>
</html>
